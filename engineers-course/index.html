<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141C47">
<title>اختبارات دورة ابنِ وكيلك الذكي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&family=Poppins:wght@600;700&display=swap">
<style>
:root{--bg:#141C47;--navy:#1E2A66;--card:#26327A;--line:rgba(255,255,255,.12);--gold:#F2C230;--w:#fff;--mut:#C9CEE6;--ok:#3DBE84;--bad:#E5484D}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal',Tahoma,sans-serif;background:radial-gradient(120% 70% at 70% 0%,#26327A 0%,var(--bg) 60%);color:var(--w);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px 16px 40px}
.top{width:100%;max-width:620px;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:18px;font-size:13px;font-weight:700;color:var(--mut)}
.top b{font-family:'Poppins',sans-serif;color:var(--gold)}
.wrap{width:100%;max-width:620px;min-width:0}
.eyebrow{color:var(--gold);font-weight:700;font-size:14px;letter-spacing:.2px}
h1{font-size:25px;font-weight:900;line-height:1.35;margin:4px 0 14px;overflow-wrap:anywhere}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;color:var(--mut);margin-bottom:8px}
.meta .sc{color:var(--gold)}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#F2C230,#FFD966);border-radius:8px;transition:width .4s ease}
.q{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 18px;box-shadow:0 18px 40px rgba(0,0,0,.28);animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.q h2{font-size:20px;font-weight:700;line-height:1.55;margin-bottom:16px;overflow-wrap:anywhere}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--navy);color:var(--w);border:2px solid var(--line);border-radius:16px;padding:14px 14px;font:700 17px/1.45 'Tajawal',Tahoma,sans-serif;margin-bottom:10px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s;overflow-wrap:anywhere}
.opt:active{transform:scale(.985)}
.opt .l{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.08);font-family:'Poppins',sans-serif;font-size:15px;color:var(--gold)}
.opt .t{flex:1;min-width:0}
.opt.ok{border-color:var(--ok);background:rgba(61,190,132,.16)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:rgba(229,72,77,.16);animation:shake .45s}
.opt.bad .l{background:var(--bad);color:#fff}
.opt.dim{opacity:.5}
.opt[disabled]{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-9px)}30%{transform:translateX(8px)}45%{transform:translateX(-6px)}60%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.q.shake{animation:shake .45s}
.exp{display:none;margin-top:6px;border-right:4px solid var(--gold);padding:12px 14px;background:rgba(255,255,255,.06);border-radius:12px;font-size:16px;line-height:1.65;animation:in .3s ease}
.exp.show{display:block}
.exp b.okc{color:var(--ok)} .exp b.badc{color:var(--bad)}
.btn{display:block;width:100%;margin-top:14px;background:var(--gold);color:var(--navy);border:0;border-radius:14px;padding:15px 20px;font:900 18px 'Tajawal',Tahoma,sans-serif;cursor:pointer}
.btn.ghost{background:transparent;color:var(--w);border:2px solid rgba(255,255,255,.28)}
.res{text-align:center}
.ring{width:170px;height:170px;margin:6px auto 12px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;font-family:'Poppins',sans-serif;font-weight:700;font-size:40px;color:var(--gold)}
.ring .n small{display:block;font-size:14px;color:var(--mut);font-family:'Tajawal';font-weight:700}
.badge{display:inline-block;background:rgba(242,194,48,.15);color:var(--gold);border-radius:999px;padding:6px 16px;font-weight:900;font-size:18px;margin-bottom:8px}
.res p{font-size:18px;font-weight:700;line-height:1.55;margin:6px 0 4px}
.rev{text-align:right;margin-top:16px}
.rev h3{font-size:16px;color:var(--gold);margin-bottom:8px}
.rev div{background:var(--navy);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:15px;line-height:1.55}
.rev div span{color:var(--ok);font-weight:700}
.menu a{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);color:var(--w);text-decoration:none;border-radius:16px;padding:15px 16px;margin-bottom:10px;font-weight:700;font-size:17px}
.menu a span{color:var(--gold);font-size:13px;white-space:nowrap}
.day{margin:18px 0 8px;font-weight:900;font-size:19px;color:var(--gold)}
.foot{margin-top:26px;font-size:12px;color:var(--mut);opacity:.8;text-align:center}
</style>
</head>

<script>
const DATA = {"halluc":{"title":"لعبة: اصطد الهلوسة","day":1,"qs":[{"q":"سألنا النموذج عن الخرسانة. أي جملة لازم تتحقق منها قبل ما تنقلها؟","a":["«الخرسانة تكسب أغلب مقاومتها خلال أول 28 يوم»","«المعالجة بالماء تقلل التشققات السطحية»","«حسب البند 4.3.7 من كود البناء، أقل غطاء للأساسات 62 مم»"],"c":2,"e":"رقم بند + مصدر + رقم دقيق + ثقة كاملة = أول علامات الهلوسة. افتح المرجع الأصلي قبل ما تنقل."},{"q":"طلبت منه مرجعاً لدراسة. أي جواب أخطر؟","a":["«ما عندي مرجع أكيد، ابحث في قواعد البيانات العلمية»","«Smith et al. 2021، مجلة ASCE، صفحة 214، مع رابط DOI»","«ما أعرف»"],"c":1,"e":"مرجع كامل بمؤلف وسنة وصفحة ورابط يبين مقنع، بس ممكن يكون مخترعاً بالكامل. رابط ما يفتح = هلوسة."},{"q":"عطاك حساب أحمال طويل ومفصّل. الصح:","a":["أعتمده لأنه مفصّل وواضح","أطلب منه يحسبه بأداة حساب، وأراجع الأرقام بنفسي","أطلب منه يعيد كتابته بشكل أرتب"],"c":1,"e":"الحسابات الطويلة مكان أخطاء النموذج. خله يستخدم أداة (كود أو إكسل)، والتوقيع عليك أنت."}]},"axis1":{"title":"اختبار: من الذكاء الاصطناعي لين الـ LLM","day":1,"qs":[{"q":"الذكاء الاصطناعي هو:","a":["برنامج يرد على الأسئلة بس","أي نظام يسوي شي كان يحتاج ذكاء بشري: يقرر، يتعرف، يتوقع","روبوت على شكل إنسان"],"c":1,"e":"الذكاء الاصطناعي مظلة كبيرة: أي نظام يقرر أو يتعرف أو يتوقع. ChatGPT جزء صغير منه."},{"q":"فلتر السبام يقرر إن الإيميل دعاية. شنو قاعد يسوي؟","a":["يصنّف","يولّد محتوى جديد","يترجم"],"c":0,"e":"يحط الإيميل بخانة: دعاية أو مو دعاية. هذا تصنيف، من أقدم استخدامات الذكاء الاصطناعي."},{"q":"الترتيب الصح من الأكبر للأصغر:","a":["LLM، ثم التوليدي، ثم التعلم العميق، ثم تعلم الآلة، ثم الذكاء الاصطناعي","تعلم الآلة، ثم الذكاء الاصطناعي، ثم LLM، ثم التعلم العميق","الذكاء الاصطناعي، ثم تعلم الآلة، ثم التعلم العميق، ثم التوليدي، ثم LLM"],"c":2,"e":"كل طبقة داخل اللي قبلها. الـ LLM أصغر دائرة: نوع من التوليدي، والتوليدي نوع من التعلم العميق."},{"q":"الفرق بين الذكاء بالقواعد وتعلم الآلة:","a":["تعلم الآلة أسرع بس","ما فيه فرق، نفس الشي","بالقواعد الإنسان يكتب القاعدة، وتعلم الآلة يطلعها بنفسه من البيانات"],"c":2,"e":"ما تقدر تكتب قاعدة لكل شي. تعلم الآلة يشوف أمثلة كثيرة ويطلع النمط بنفسه."},{"q":"نتفلكس يقترح لك مسلسل. ذكاء اصطناعي؟ وأي نوع؟","a":["لا، مجرد قواعد مكتوبة","نعم، تعلم آلة: يتعلم من سجل المشاهدة","نعم، LLM مثل ChatGPT"],"c":1,"e":"ذكاء اصطناعي؟ نعم. نوعه: تعلم آلة (نظام توصيات). يتعلم من اللي شفته أنت وملايين غيرك، بس ما يكتب ولا يتكلم."},{"q":"التعلم العميق يعتمد على:","a":["شبكات عصبية فيها طبقات كثيرة","جداول Excel","قواعد «إذا… إذن» مكتوبة"],"c":0,"e":"شبكات عصبية بطبقات كثيرة تتعلم من صور وصوت ونص خام. هي اللي خلت الجوال يعرف وجهك."},{"q":"الجوال يفتح لما يشوف وجهك:","a":["LLM","تعلم عميق: شبكة عصبية تتعرف على الصور","قاعدة مكتوبة: «إذا الوجه كذا افتح»"],"c":1,"e":"الوجوه تختلف بالإضاءة والزاوية، ما تنكتب لها قواعد. شبكة عصبية عميقة تتعلم شكل وجهك."},{"q":"الفرق بين الذكاء التقليدي والتوليدي:","a":["التوليدي أغلى بس","التقليدي يقول «هذي صورة قطة»، والتوليدي يرسم لك قطة","التقليدي للصور والتوليدي للأرقام"],"c":1,"e":"التقليدي يحلل ويصنّف. التوليدي يصنع شي جديد: نص، صورة، صوت، فيديو."},{"q":"ChatGPT يكتب لك إيميل للمقاول:","a":["تعلم آلة تقليدي يصنّف","قواعد مكتوبة باليد","LLM: ذكاء توليدي متخصص باللغة"],"c":2,"e":"يصنع نصاً جديداً = توليدي. ومتخصص باللغة = LLM. هذا أصغر دائرة بالخريطة."},{"q":"خرائط جوجل تتوقع الزحمة وتختار لك أسرع طريق:","a":["تعلم آلة: يتعلم من بيانات الحركة","LLM يكتب لك الطريق","ذكاء توليدي يرسم الخريطة"],"c":0,"e":"يتعلم من حركة ملايين السيارات ويتوقع الزحمة. هذا تعلم آلة: يتوقع، بس ما يكتب ولا يولّد."},{"q":"ليش سنة 2012 مهمة؟","a":["ولادة مصطلح «الذكاء الاصطناعي»","قفزة التعلم العميق بالتعرف على الصور","طلع ChatGPT"],"c":1,"e":"المصطلح من 1956، وChatGPT في 2022. سنة 2012 الشبكات العميقة تفوقت بالتعرف على الصور."},{"q":"سنة 2017 ظهرت معمارية Transformer. ليش مهمة؟","a":["أساس النماذج اللغوية الحديثة مثل ChatGPT وClaude","أول روبوت يمشي","فاز فيها الكمبيوتر بالشطرنج"],"c":0,"e":"الـ Transformer هو المحرك اللي بنيت عليه كل الـ LLMs. الشطرنج كان 1997 مع Deep Blue."}]},"vote":{"title":"لعبة: أتمتة، إنسان، ذكاء، ولا وكيل؟","day":1,"opts4":["A · أتمتة بقواعد","B const app = document.getElementById('app');

const DAYS = ['','الأول','الثاني','الثالث'], LET = ['A','B','C','D'];

const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
function menu(){
  let h = '<div class="eyebrow">اختر الاختبار</div><h1>اختبارات الدورة</h1><div class="menu">', day = 0;

}
function run(k){
  const z = DATA[k], N = z.qs.length; let i = 0, score = 0; const wrong = [];

    const pct = score / N, R = 70, C = 2 * Math.PI * R;
    const [badge, msg] = pct === 1 ? ['علامة كاملة', 'ماسك الدرس كامل. ارفع يدك!'] : pct >= .75 ? ['ممتاز', 'قريب جداً. شوف اللي فاتك تحت.'] : pct >= .5 ? ['زين', 'راجع الأسئلة اللي تحت مع زميلك.'] : ['ولا يهمك', 'اسأل المدرب عن الأسئلة اللي تحت.'];
    let h = head() + `<div class="q res"><div class="ring"><svg width="170" height="170"><circle cx="85" cy="85" r="${R}" stroke="rgba(255,255,255,.12)" stroke-width="12" fill="none"/><circle id="arc" cx="85" cy="85" r="${R}" stroke="#F2C230" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1s ease"/></svg><div class="n"><div>${score}/${N}<small>إجابة صحيحة</small></div></div></div><div class="badge">${badge}</div><p>${msg}</p>`;
    if (wrong.length) { h += '<div class="rev"><h3>راجع هذي</h3>'; wrong.forEach(w => { h += `<div>${esc(w.q)}<br><span>الصح: ${esc(w.a)}</span></div>`; }); h += '</div>'; }

    if (pct === 1) buzz([40, 60, 40, 60, 120]);
    document.getElementById('again').onclick = () => run(k);
    document.getElementById('all').onclick = () => { location.search = ''; };
  }
  function show(){
    if (i >= N) return result();
    const q = z.qs[i];

    q.a.forEach((a, j) => { h += `<button class="opt" data-j="${j}"><span class="l">${LET[j]}</span><span class="t">${esc(a.replace(/^[A-D] · /, ''))}</span></button>`; });
    h += `<div class="exp" id="exp"></div><div id="next"></div></div>`;
    app.innerHTML = h;
    app.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
      const j = +b.dataset.j, right = j === q.c;
      app.querySelectorAll('.opt').forEach(x => { x.disabled = true; const xj = +x.dataset.j; if (xj === q.c) x.classList.add('ok'); else if (x !== b) x.classList.add('dim'); });
      if (right) { score++; buzz(30); } else { b.classList.add('bad'); buzz([90, 50, 90]); wrong.push({ q: q.q, a: q.a[q.c].replace(/^[A-D] · /, '') }); }
      const e = document.getElementById('exp'); e.innerHTML = `<b class="${right ? 'okc' : 'badc'}">${right ? 'صح!' : 'مو صح.'}</b> ${esc(q.e)}`; e.classList.add('show');
