<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شاشة المدرب · ابنِ وكيلك الذكي</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="data.js"></script>
<script src="common.js"></script>
<style>
body{overflow:hidden}
.bar{display:flex;gap:8px;align-items:center;padding:10px 18px;background:var(--navyD);border-bottom:3px solid var(--gold);flex-wrap:wrap}
.bar .brand{margin-inline-end:auto;font-size:20px}
.tab{background:var(--card);color:#fff;padding:9px 16px;border-radius:10px;font-size:16px;font-weight:700}
.tab.on{background:var(--gold);color:var(--navy)}
.stage{height:calc(100vh - 62px);padding:26px 40px;display:flex;flex-direction:column;overflow:auto}
.ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:auto;padding-top:16px}
.cbtn{background:var(--gold);color:var(--navy);padding:12px 22px;border-radius:12px;font-size:18px;font-weight:800}
.cbtn.g{background:var(--card);color:#fff}
.cbtn.r{background:var(--bad);color:#fff}
select.sel{padding:11px;border-radius:10px;font-size:17px;border:0}
.qq{font-size:40px;font-weight:800;line-height:1.35;margin:8px 0 22px}
.hopts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hopt{display:flex;align-items:center;gap:16px;padding:20px 22px;border-radius:16px;font-size:26px;font-weight:800;min-height:100px;position:relative;overflow:hidden}
.hopt b{flex:none;width:56px;height:56px;border-radius:12px;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:28px}
.hopt .cnt{margin-inline-start:auto;font-size:30px}
.hopt.dim{opacity:.28}
.hopt .fill{position:absolute;inset-block:0;inset-inline-start:0;background:rgba(255,255,255,.18)}
.hopt>*{position:relative}
.meta{display:flex;gap:18px;align-items:center;font-size:20px;color:#C9CEE6}
.clock{width:84px;height:84px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-size:38px;font-weight:800}
.lobby{display:grid;grid-template-columns:380px 1fr;gap:40px;align-items:start}
.qr{background:#fff;padding:18px;border-radius:18px}
.qr img{width:100%;display:block}
.url{font-size:22px;font-weight:800;color:var(--gold);direction:ltr;text-align:center;margin-top:12px;word-break:break-all}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tcard{background:var(--card);border-radius:14px;padding:16px;font-size:22px;font-weight:800}
.tcard small{display:block;font-size:15px;color:#C9CEE6;font-weight:500;margin-top:6px}
.board .rank{font-size:26px;padding:16px 20px}
.board .rank .n{width:44px;height:44px;font-size:22px}
.hwall{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.hwall .post .meta{font-size:16px}
.hwall .post .tx{font-size:16px;max-height:220px}
.cnt-like{background:var(--bad);color:#fff;border-radius:999px;padding:5px 12px;font-weight:800}
.bars .rowb{display:flex;align-items:center;gap:14px;margin:10px 0;font-size:22px;font-weight:800}
.bars .nm{width:220px}
.bars .bb{flex:1;background:var(--card);border-radius:10px;height:44px;overflow:hidden}
.bars .bb i{display:block;height:100%;background:var(--gold);border-radius:10px}
.bars .pp{width:70px;color:var(--gold);text-align:left}
.award{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:14px}
.award .tcard{display:flex;align-items:center;gap:6px;font-size:18px;padding:10px 12px}
.award .tcard span{margin-inline-end:auto}
.award button{background:var(--gold);color:var(--navy);border-radius:8px;padding:6px 10px;font-weight:800;font-size:15px}
.award button.m{background:#3A4580;color:#fff}
.modal{position:fixed;inset:0;background:rgba(10,14,40,.75);display:none;place-items:center}
.modal .box{background:#fff;color:var(--ink);border-radius:16px;padding:24px;width:420px}
.toast{position:fixed;bottom:20px;inset-inline-start:20px;background:var(--ok);color:#fff;padding:12px 18px;border-radius:10px;font-weight:700;display:none}
.mode-local{position:fixed;bottom:8px;inset-inline-end:10px;font-size:12px;color:#8F96BF}
</style>
</head>
<body>
<div class="bar">
  <span class="brand">ابنِ وكيلك الذكي · شاشة المدرب</span>
  <button class="tab" data-m="lobby">الدخول</button>
  <button class="tab" data-m="quiz">الأسئلة</button>
  <button class="tab" data-m="wall">الجدار</button>
  <button class="tab" data-m="cup">الكأس</button>
  <button class="tab" id="reset" style="background:#3A4580">⋯</button>
</div>
<div class="stage" id="stage"></div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<div class="mode-local" id="ml"></div>
<script>
(async () => {
  const db = await LIVE.db(), E = LIVE.esc, $ = s => document.querySelector(s), stage = $('#stage');
  const CFG = window.LIVE_CONFIG || {};
  $('#ml').textContent = db.mode === 'local' ? 'وضع التجربة (بدون نت)' : '';
  let off = 0; db.offset(o => off = o); const now = () => Date.now() + off;
  const S = { state: { mode: 'lobby' }, teams: {}, players: {}, cup: {}, starts: {}, ans: {}, wall: {}, votes: {}, allStarts: {}, allAns: {} };
  const sub = (p, k) => db.on(p, v => { S[k] = v || {}; render(); });
  db.on('state', v => { S.state = v || { mode: 'lobby' }; render(); });
  sub('teams', 'teams'); sub('players', 'players'); sub('cup', 'cup'); sub('starts', 'allStarts'); sub('ans', 'allAns');
  sub('wall', 'wallAll'); sub('votes', 'votesAll');
  const setState = p => db.update('state', p);
  const toast = t => { const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => el.style.display = 'none', 2200); };
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => setState({ mode: b.dataset.m }));
  $('#reset').onclick = () => modal(`<h2 style="margin-top:0">إعدادات</h2>
    <p>مسح كل شي (الفرق، الأجوبة، الصور، الكأس) قبل بداية الدورة. اكتب <b>مسح</b> للتأكيد.</p>
    <input class="field" id="cf" placeholder="مسح"><button class="cbtn r" id="doit">امسح الكل</button> <button class="cbtn g" id="cl">إلغاء</button>`, () => {
      $('#cl').onclick = closeModal;
      $('#doit').onclick = async () => { if ($('#cf').value.trim() !== 'مسح') return; await db.set('', { state: { mode: 'lobby' } }); closeModal(); toast('انمسح كل شي'); };
    });
  function modal(html, wire) { $('#mbox').innerHTML = html; $('#modal').style.display = 'grid'; wire && wire(); }
  function closeModal() { $('#modal').style.display = 'none'; }

  // timer loop: auto reveal at time-out
  setInterval(() => {
    const st = S.state; if (st.mode !== 'quiz' || st.phase !== 'q') return;
    const t0 = (S.allStarts[st.set] || {})[st.qi]; if (!t0) return;
    const left = Math.max(0, LIVE.T - (now() - t0) / 1000);
    const c = $('#clk'); if (c) c.textContent = Math.ceil(left);
    const answered = Object.keys(((S.allAns[st.set] || {})[st.qi]) || {}).length;
    if (left <= 0 || (answered > 0 && answered >= Object.keys(S.players).length)) setState({ phase: 'reveal' });
  }, 300);

  document.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'ArrowLeft') { const b = $('#next'); if (b) { e.preventDefault(); b.click(); } } });

  function render() {
    document.querySelectorAll('[data-m]').forEach(b => b.classList.toggle('on', b.dataset.m === S.state.mode));
    const m = S.state.mode;
    if (m === 'quiz') return quiz();
    if (m === 'wall') return wall();
    if (m === 'cup') return cup();
    return lobby();
  }
  const teamOf = pid => (S.players[pid] || {}).team;
  const tname = tid => (S.teams[tid] || {}).name || '—';

  function lobby() {
    const counts = {}; Object.values(S.players).forEach(p => counts[p.team] = (counts[p.team] || 0) + 1);
    const url = CFG.joinUrl || location.href.replace(/host\.html.*$/, '');
    stage.innerHTML = `<div class="lobby"><div><div class="qr"><img src="qr.png" alt=""></div><div class="url">${E(url.replace(/^https?:\/\//, ''))}</div></div>
      <div><h1 style="font-size:44px;margin:0 0 6px">امسح وادخل بفريقك</h1><p class="sub" style="font-size:22px">${Object.keys(S.players).length} مشارك · ${Object.keys(S.teams).length} فرق</p>
      <div class="tgrid">${Object.entries(S.teams).map(([id, t]) => `<div class="tcard">${E(t.name)}<small>${counts[id] || 0} أعضاء</small></div>`).join('')}</div></div></div>`;
  }

  // ---------- QUIZ ----------
  function quiz() {
    const st = S.state;
    if (!st.set || !window.LIVE_SETS[st.set] || !st.phase) return quizPick();
    const set = window.LIVE_SETS[st.set], q = set.qs[st.qi], starts = S.allStarts[st.set] || {}, ans = S.allAns[st.set] || {};
    const head = `<div class="meta"><span>${E(set.title)} · سؤال ${st.qi + 1} من ${set.qs.length}</span></div>`;
    if (st.phase === 'q' || st.phase === 'reveal') {
      const a = ans[st.qi] || {}, cnt = [0, 0, 0, 0]; Object.values(a).forEach(r => cnt[r.a]++);
      const total = Object.keys(a).length, rev = st.phase === 'reveal';
      stage.innerHTML = head + `<div style="display:flex;gap:20px;align-items:flex-start"><div class="qq" style="flex:1">${E(q.q)}</div>${rev ? '' : `<div class="clock" id="clk">${LIVE.T}</div>`}</div>
        <div class="hopts">${q.a.map((x, i) => `<div class="hopt ${rev && i !== q.c ? 'dim' : ''}" style="background:${LIVE.COLORS[i]}">${rev ? `<span class="fill" style="width:${total ? cnt[i] / total * 100 : 0}%"></span>` : ''}<b>${LIVE.LETTERS[i]}</b><span>${E(x)}</span>${rev ? `<span class="cnt">${cnt[i]}</span>` : ''}</div>`).join('')}</div>
        ${rev && q.e ? `<div class="expl" style="font-size:22px">${E(q.e)}</div>` : ''}
        <div class="ctrl"><span class="meta">${total} من ${Object.keys(S.players).length} جاوبوا</span><span style="flex:1"></span>
        ${rev ? `<button class="cbtn" id="next">الترتيب ←</button>` : `<button class="cbtn g" id="next">اكشف الجواب</button>`}<button class="cbtn g" id="quit">إنهاء</button></div>`;
      $('#next').onclick = () => setState({ phase: rev ? 'board' : 'reveal' });
      $('#quit').onclick = () => setState({ phase: null, set: null });
      return;
    }
    const sc = LIVE.score(st.set, ans, starts, S.players, S.teams), last = st.qi + 1 >= set.qs.length;
    const tops = Object.entries(sc.players).sort((a, b) => b[1] - a[1]).slice(0, 5);
    stage.innerHTML = head + `<h1 style="font-size:40px;margin:6px 0 14px">${last ? 'النتيجة النهائية 🏁' : 'الترتيب'}</h1>
      <div style="display:grid;grid-template-columns:1.2fr 1fr;gap:30px" class="board">
        <div><div class="sub" style="font-size:20px">الفرق (متوسط نقاط الأعضاء)</div>${sc.teams.map((t, i) => `<div class="rank"><span class="n">${i + 1}</span>${E(t.name)}<span class="p">${t.avg}</span></div>`).join('')}</div>
        <div><div class="sub" style="font-size:20px">أسرع 5 أشخاص</div>${tops.map(([pid, p], i) => `<div class="rank" style="font-size:20px"><span class="n">${i + 1}</span>${E((S.players[pid] || {}).name || '؟')}<small style="color:#C9CEE6">&nbsp;${E(tname(teamOf(pid)))}</small><span class="p">${p}</span></div>`).join('')}</div>
      </div>
      <div class="ctrl"><span style="flex:1"></span>${last ? `<button class="cbtn" id="cupit">اعتمد نقاط الكأس (3·2·1)</button><button class="cbtn g" id="done">رجوع</button>` : `<button class="cbtn" id="next">السؤال الجاي ←</button>`}</div>`;
    if (!last) $('#next').onclick = () => nextQ(st.set, st.qi + 1);
    else {
      $('#done').onclick = () => setState({ phase: null, set: null });
      $('#cupit').onclick = async () => { await award(st.set, sc.teams.slice(0, 3).map(t => t.tid)); toast('انضافت نقاط الكأس'); setState({ mode: 'cup', phase: null, set: null }); };
    }
  }
  async function nextQ(set, qi) {
    await db.update('', { ['starts/' + set + '/' + qi]: db.TS, 'state/set': set, 'state/qi': qi, 'state/phase': 'q', 'state/mode': 'quiz' });
  }
  function quizPick() {
    stage.innerHTML = `<h1 style="font-size:40px">اختر اللعبة</h1><div class="tgrid">${window.LIVE_ORDER.map(k => `<button class="tcard" style="text-align:right;color:#fff" data-s="${k}">${E(window.LIVE_SETS[k].title)}<small>${window.LIVE_SETS[k].qs.length} أسئلة${(S.allAns[k] ? ' · انلعبت قبل' : '')}</small></button>`).join('')}</div>`;
    stage.querySelectorAll('[data-s]').forEach(b => b.onclick = async () => {
      const k = b.dataset.s;
      await db.update('', { ['ans/' + k]: null, ['starts/' + k]: null, ['mine/' + k]: null });
      nextQ(k, 0);
    });
  }
  async function award(ev, tids) {
    const upd = {}; Object.keys(S.teams).forEach(t => upd['cup/' + t + '/' + ev] = null);
    tids.forEach((t, i) => upd['cup/' + t + '/' + ev] = 3 - i);
    await db.update('', upd);
  }

  // ---------- WALL ----------
  const WALLS = { bridge: { t: 'تحدي كمّل الجسر', kind: 'img' }, exact: { t: 'تحدي التعليمات الدقيقة', kind: 'img' }, battle: { t: 'معركة البرومبت', kind: 'text' } };
  function wall() {
    const st = S.state;
    if (!st.wall) {
      stage.innerHTML = `<h1 style="font-size:40px">اختر الجدار</h1><div class="tgrid">${Object.entries(WALLS).map(([k, w]) => `<button class="tcard" style="text-align:right;color:#fff" data-w="${k}">${w.t}<small>${w.kind === 'text' ? 'نص' : 'صور'}</small></button>`).join('')}</div>`;
      stage.querySelectorAll('[data-w]').forEach(b => b.onclick = () => setState({ wall: b.dataset.w, wtitle: WALLS[b.dataset.w].t, wkind: WALLS[b.dataset.w].kind, wphase: 'upload' }));
      return;
    }
    const posts = Object.entries((S.wallAll || {})[st.wall] || {}), votes = (S.votesAll || {})[st.wall] || {};
    const counts = {}; Object.values(votes).forEach(v => counts[v] = (counts[v] || 0) + 1);
    const sorted = posts.map(([k, p]) => [k, p, counts[k] || 0]);
    if (st.wphase !== 'upload') sorted.sort((a, b) => b[2] - a[2]);
    const ph = st.wphase;
    stage.innerHTML = `<div style="display:flex;align-items:baseline;gap:16px"><h1 style="font-size:38px;margin:0">${E(st.wtitle)}</h1><span class="meta">${ph === 'upload' ? 'استقبال المشاركات' : ph === 'vote' ? 'التصويت شغّال' : 'سكّر التصويت'} · ${posts.length} مشاركة · ${Object.keys(votes).length} صوت</span></div>
      <div class="hwall" style="margin-top:16px">${sorted.map(([k, p, c], i) => `<div class="post" ${ph === 'closed' && i === 0 ? 'style="outline:5px solid var(--gold)"' : ''}>${p.img ? `<img src="${p.img}">` : `<div class="tx">${E(p.text)}</div>`}
        <div class="meta"><span>${E(p.cap || tname(p.team))} <small style="color:var(--muted)">· ${E(tname(p.team))}</small></span>${ph !== 'upload' ? `<span class="cnt-like">♥ ${c}</span>` : ''}</div></div>`).join('')}</div>
      <div class="ctrl"><span style="flex:1"></span>
        ${ph === 'upload' ? `<button class="cbtn" id="next">افتح التصويت ←</button>` : ph === 'vote' ? `<button class="cbtn" id="next">سكّر وأعلن الفايز</button>` : `<button class="cbtn" id="cupit">اعتمد نقاط الكأس (3·2·1)</button>`}
        <button class="cbtn g" id="clr">مسح الجدار</button><button class="cbtn g" id="back">جدار ثاني</button></div>`;
    if ($('#next')) $('#next').onclick = () => setState({ wphase: ph === 'upload' ? 'vote' : 'closed' });
    if ($('#cupit')) $('#cupit').onclick = async () => {
      const best = []; sorted.forEach(([, p]) => { if (!best.includes(p.team)) best.push(p.team); });
      await award(st.wall, best.slice(0, 3)); toast('انضافت نقاط الكأس'); setState({ mode: 'cup' });
    };
    $('#back').onclick = () => setState({ wall: null });
    $('#clr').onclick = () => modal(`<h2 style="margin-top:0">مسح الجدار؟</h2><p>تنمسح كل المشاركات والأصوات بهذا الجدار.</p><button class="cbtn r" id="y">امسح</button> <button class="cbtn g" id="n">إلغاء</button>`, () => {
      $('#n').onclick = closeModal; $('#y').onclick = async () => { await db.update('', { ['wall/' + st.wall]: null, ['votes/' + st.wall]: null, 'state/wphase': 'upload' }); closeModal(); };
    });
  }

  // ---------- CUP ----------
  const EVENTS = [['bridge', 'كمّل الجسر'], ['day1', 'كاهوت اليوم الأول'], ['exact', 'التعليمات الدقيقة'], ['battle', 'معركة البرومبت'], ['agent', 'كاهوت الوكيل'], ['redteam', 'تحدي الحصن'], ['final', 'كاهوت النهائي']];
  let evSel = 'redteam';
  function cup() {
    const L = LIVE.cupTotals(S.cup, S.teams), max = Math.max(1, ...L.map(t => t.pts));
    stage.innerHTML = `<h1 style="font-size:44px;margin:0 0 10px">كأس أذكى فريق 🏆</h1>
      <div class="bars">${L.map((t, i) => `<div class="rowb"><span class="nm">${i + 1}. ${E(t.name)}</span><span class="bb"><i style="width:${t.pts / max * 100}%"></i></span><span class="pp">${t.pts}</span></div>`).join('')}</div>
      <details style="margin-top:18px"><summary class="sub" style="cursor:pointer;font-size:18px">نقاط يدوية (للمسابقات اللي بدون جوال)</summary>
        <div style="margin-top:10px"><select class="sel" id="ev">${EVENTS.map(([k, t]) => `<option value="${k}" ${k === evSel ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
        <div class="award">${L.map(t => `<div class="tcard"><span>${E(t.name)} <small style="display:inline;color:#C9CEE6">(${(t.ev[evSel] || 0)})</small></span>${[3, 2, 1].map(n => `<button data-t="${t.tid}" data-n="${n}">${n}+</button>`).join('')}<button class="m" data-t="${t.tid}" data-n="0">0</button></div>`).join('')}</div>
      </details>`;
    $('#ev').onchange = e => { evSel = e.target.value; const d = stage.querySelector('details'); render(); stage.querySelector('details').open = true; };
    stage.querySelectorAll('[data-n]').forEach(b => b.onclick = async () => {
      const n = +b.dataset.n; await db.set('cup/' + b.dataset.t + '/' + evSel, n || null); stage.querySelector('details').open = true;
    });
    if (S._cupOpen) stage.querySelector('details').open = true;
    stage.querySelector('details').ontoggle = e => S._cupOpen = e.target.open;
  }
})();
</script>
</body>
</html>
