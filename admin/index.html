<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1E2A66">
<title>لوحة الحجوزات · Business Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@500;700&display=swap">
<style>
:root{--navy:#1E2A66;--navy2:#2A3680;--ink:#0E1440;--gold:#F2C230;--bg:#F3F5FB;--card:#fff;--line:#E3E7F3;--muted:#6B7394;
--c-new:#F2C230;--c-talk:#3B82F6;--c-paid:#16A34A;--c-done:#8A93B4;--c-cancel:#E04848}
*{box-sizing:border-box}html{color-scheme:light only}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px -16px rgba(0,0,0,.6)}
.top svg{width:30px;height:30px;flex:none}
.top h1{font-size:18px;margin:0;font-weight:700;flex:1;line-height:1.2}
.top small{display:block;font-weight:400;font-size:12px;opacity:.75;margin-top:2px}
.ic{width:40px;height:40px;border-radius:11px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;display:grid;place-items:center;padding:0}
.ic svg{width:20px;height:20px}
.ic.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{rotate:360deg}}
.wrap{max-width:1100px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}
.kpi{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 10px;text-align:center;transition:transform .15s,border-color .15s;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:var(--k,var(--navy))}
.kpi b{display:block;font-size:30px;line-height:1.1;font-family:"Inter",sans-serif;color:var(--ink)}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi.on{border-color:var(--k,var(--navy));transform:translateY(-2px);box-shadow:0 10px 24px -16px rgba(30,42,102,.6)}
.kpi.on span{color:var(--ink)}
.tools{display:flex;gap:10px;margin:16px 0 12px}
.tools input{flex:1;height:46px;border-radius:13px;border:1.5px solid var(--line);background:#fff;padding:0 14px;font:inherit;font-size:15px;outline:none}
.tools input:focus{border-color:var(--navy)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.cl{background:var(--card);border:1.5px solid var(--line);border-right:6px solid var(--s,var(--navy));border-radius:18px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px}
.cl.busy{opacity:.55;pointer-events:none}
.h{display:flex;align-items:flex-start;gap:10px}
.av{width:44px;height:44px;border-radius:14px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.nm{flex:1;min-width:0}.nm b{font-size:17px;display:block}.nm small{color:var(--muted);font-size:12.5px}
.badge{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--s);color:#fff;white-space:nowrap}
.badge.new{color:var(--ink)}
.when{display:flex;align-items:center;gap:8px;background:#F7F8FC;border-radius:12px;padding:9px 12px;font-weight:600;font-size:14.5px}
.when.today{background:#FFF6D6;outline:1.5px solid var(--gold)}
.when svg{width:18px;height:18px;color:var(--navy2);flex:none}
.goal{font-size:14px;line-height:1.6;color:#2B3357;white-space:pre-wrap}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.meta a{color:var(--navy2);font-weight:600}
.act{display:flex;gap:8px;flex-wrap:wrap}
.b{height:40px;padding:0 14px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:7px;color:var(--ink)}
.b svg{width:18px;height:18px}
.b.wa{background:#25D366;border-color:#25D366;color:#fff}
.b.ig{background:#fff;color:#C13584;border-color:#F3C9DF}
.b.ok{flex:1;justify-content:center}
.b.ok.on{background:#E7F6EC;border-color:var(--c-paid);color:#15803D}
.st{display:flex;gap:6px;flex-wrap:wrap}
.st button{height:32px;padding:0 11px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--muted)}
.st button.on{background:var(--s);border-color:var(--s);color:#fff}
.st button.on.new{color:var(--ink)}
.empty{grid-column:1/-1;text-align:center;padding:50px 16px;color:var(--muted);font-weight:600}
.gate{max-width:380px;margin:60px auto;background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:26px 22px;text-align:center}
.gate input{width:100%;height:48px;border-radius:12px;border:1.5px solid var(--line);padding:0 14px;font:inherit;font-size:16px;margin:14px 0;direction:ltr;text-align:center}
.gate button{width:100%;height:48px;border-radius:12px;border:0;background:var(--gold);color:var(--ink);font-weight:700;font-size:16px}
.gate p{color:var(--muted);font-size:13.5px;margin:0}
.err{background:#FDECEC;color:#B00020;border-radius:12px;padding:12px 14px;font-weight:600;margin-bottom:12px;display:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top">
  <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M17 19h10a3 3 0 013 3v4a12 12 0 0012 12h3a3 3 0 013 3v4a11 11 0 01-11 11H17A11 11 0 016 45V30a11 11 0 0111-11z" fill="#fff"/><rect x="31" y="8" width="25" height="25" rx="8" fill="#F2C230"/></svg>
  <h1>لوحة الحجوزات<small id="upd">…</small></h1>
  <button class="ic" id="refresh" title="تحديث"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></button>
  <button class="ic" id="logout" title="خروج"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M13 4h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5"/></svg></button>
</header>

<main class="wrap">
  <div class="err" id="err"></div>
  <section class="gate" id="gate" hidden>
    <b style="font-size:18px">رمز الدخول</b>
    <input id="key" type="password" placeholder="••••••" autocomplete="current-password">
    <button id="enter">دخول</button>
    <p style="margin-top:12px">الرمز نفسه اللي بإعدادات السكربت (DASH_KEY). يُحفظ بجهازك مرة وحدة.</p>
  </section>
  <div id="app" hidden>
    <div class="cards" id="cards"></div>
    <div class="tools"><input id="q" placeholder="ابحث بالاسم أو الحساب أو الرقم…"></div>
    <div class="list" id="list"></div>
  </div>
</main>

<script>
const API = "https://script.google.com/macros/s/AKfycbw2gJUS7_nDwOSdCSCBbV7eF4j4kjRlxblMczYSpjOZh6CuDnVlrDhmS9oarSC3NcOy/exec";
const STATUSES = [
  {k:"جديد",c:"var(--c-new)",cls:"new"},{k:"تواصلنا",c:"var(--c-talk)"},{k:"دفع",c:"var(--c-paid)"},{k:"تمت",c:"var(--c-done)"},{k:"ملغي",c:"var(--c-cancel)"}];
const $=s=>document.querySelector(s);
let KEY = "", rows = [], filter = "الكل", q = "";
try{ KEY = localStorage.getItem("bs_dash_key")||""; }catch(e){}

const sc = k => (STATUSES.find(s=>s.k===k)||{c:"var(--navy)"}).c;
const scls = k => (STATUSES.find(s=>s.k===k)||{}).cls||"";
const esc = s => String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const digits = s => String(s||"").replace(/[^0-9]/g,"");
const DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const todayStr = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
function dayLabel(iso){ if(!iso) return "ما حدد يوم"; const d=new Date(iso+"T00:00:00"); if(isNaN(d)) return iso; const t=todayStr(); const pre = iso===t?"اليوم":DAYS[d.getDay()]; return pre+" "+d.getDate()+"/"+(d.getMonth()+1); }
function hour12(h){ if(!h) return ""; const [H,M]=h.split(":").map(Number); if(isNaN(H)) return h; const p=H>=12?"م":"ص"; return ((H%12)||12)+":"+String(M||0).padStart(2,"0")+" "+p; }
function weekStart(){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-d.getDay()); return d; }

async function api(params){
  const u = new URL(API); u.searchParams.set("key",KEY); Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
  const r = await fetch(u, {redirect:"follow"}); const j = await r.json();
  if(j.error) throw new Error(j.error); return j;
}
function showErr(m){ const e=$("#err"); e.textContent=m; e.style.display=m?"block":"none"; }

async function load(){
  if(!KEY){ $("#gate").hidden=false; $("#app").hidden=true; return; }
  $("#refresh").classList.add("spin");
  try{
    const j = await api({action:"list"});
    rows = j.rows||[]; $("#gate").hidden=true; $("#app").hidden=false; showErr("");
    $("#upd").textContent = "آخر تحديث " + new Date().toLocaleTimeString("ar-KW",{hour:"2-digit",minute:"2-digit"}) + " · " + rows.length + " طلب";
    render();
  }catch(e){
    if(/key|رمز/i.test(e.message)){ try{localStorage.removeItem("bs_dash_key")}catch(_){} KEY=""; $("#gate").hidden=false; $("#app").hidden=true; showErr("الرمز غلط، جرّب مرة ثانية."); }
    else showErr("ما قدرت أجيب البيانات: "+e.message);
  }
  $("#refresh").classList.remove("spin");
}

function render(){
  const ws = weekStart();
  const counts = {"الكل":rows.length,"هالأسبوع":rows.filter(r=>new Date(r.time)>=ws).length};
  STATUSES.forEach(s=>counts[s.k]=rows.filter(r=>r.status===s.k).length);
  counts["ما كلمناهم"]=rows.filter(r=>!r.contacted && r.status!=="ملغي" && r.status!=="تمت").length;
  const order=["الكل","ما كلمناهم","جديد","تواصلنا","دفع","تمت","ملغي","هالأسبوع"];
  const kc={"الكل":"var(--navy)","ما كلمناهم":"var(--c-cancel)","هالأسبوع":"var(--navy2)"};
  $("#cards").innerHTML = order.map(k=>`<button class="kpi ${filter===k?"on":""}" style="--k:${kc[k]||sc(k)}" data-f="${k}"><b>${counts[k]}</b><span>${k}</span></button>`).join("");
  $("#cards").querySelectorAll(".kpi").forEach(b=>b.onclick=()=>{filter=b.dataset.f;render();});

  let list = rows.slice();
  if(filter==="هالأسبوع") list=list.filter(r=>new Date(r.time)>=ws);
  else if(filter==="ما كلمناهم") list=list.filter(r=>!r.contacted && r.status!=="ملغي" && r.status!=="تمت");
  else if(filter!=="الكل") list=list.filter(r=>r.status===filter);
  if(q){ const n=q.toLowerCase(); list=list.filter(r=>[r.name,r.account,r.phone,r.email,r.goal].join(" ").toLowerCase().includes(n)); }
  const t=todayStr();
  list.sort((a,b)=>{ const ad=a.day||"9999", bd=b.day||"9999"; const aa=(ad<t)?"z"+ad:ad, bb=(bd<t)?"z"+bd:bd; return aa.localeCompare(bb)||(a.hour||"").localeCompare(b.hour||""); });

  $("#list").innerHTML = list.length? list.map(card).join("") : `<div class="empty">ما فيه طلبات هنا</div>`;
  $("#list").querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>setField(b));
}

function card(r){
  const ini = (r.name||"؟").trim().charAt(0);
  const wa = "https://wa.me/"+digits(r.cc==="other"?"":r.cc)+digits(r.phone);
  const ig = r.account? "https://instagram.com/"+String(r.account).replace(/^@/,"").replace(/^https?:\/\/(www\.)?instagram\.com\//,"").replace(/\/.*$/,"") : "";
  const when = r.day===todayStr();
  return `<article class="cl ${""}" style="--s:${sc(r.status)}" data-row="${r.row}">
    <div class="h"><div class="av">${esc(ini)}</div><div class="nm"><b>${esc(r.name||"بدون اسم")}</b><small>طلب ${esc(new Date(r.time).toLocaleDateString("ar-KW",{day:"numeric",month:"short"}))} · ${esc(r.page||"")}</small></div><span class="badge ${scls(r.status)}">${esc(r.status||"جديد")}</span></div>
    <div class="when ${when?"today":""}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>${esc(dayLabel(r.day))} · ${esc(hour12(r.hour))}</div>
    ${r.goal?`<div class="goal">${esc(r.goal)}</div>`:""}
    <div class="meta"><span dir="ltr">${esc((r.cc==="other"?"":r.cc)+" "+r.phone)}</span>${r.email?`<a href="mailto:${esc(r.email)}">${esc(r.email)}</a>`:""}${r.account?`<a href="${esc(ig)}" target="_blank" rel="noopener">${esc(r.account)}</a>`:""}</div>
    <div class="act">
      <a class="b wa" href="${esc(wa)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 1.8a8.2 8.2 0 1 1-4.2 15.3l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 0 1 12 3.8zm-3.3 4.4c-.2 0-.5 0-.7.3-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2 3.2 5 4.4 2.5 1 3 .8 3.5.7.5 0 1.7-.7 2-1.4.2-.7.2-1.2.1-1.3l-.5-.3-1.8-.9c-.3-.1-.5-.1-.7.1l-.9 1.1c-.2.2-.3.2-.6.1-.3-.2-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.5-.5.3-.5v-.6l-.8-2c-.2-.5-.4-.4-.6-.4z"/></svg>واتساب</a>
      ${ig?`<a class="b ig" href="${esc(ig)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>انستقرام</a>`:""}
      <button class="b ok ${r.contacted?"on":""}" data-set="contacted" data-val="${r.contacted?"false":"true"}">${r.contacted?"✓ كلمناه":"☐ كلمناه؟"}</button>
    </div>
    <div class="st">${STATUSES.map(s=>`<button class="${r.status===s.k?"on "+(s.cls||""):""}" style="--s:${s.c}" data-set="status" data-val="${s.k}">${s.k}</button>`).join("")}</div>
  </article>`;
}

async function setField(btn){
  const art = btn.closest(".cl"); const row = +art.dataset.row; const field = btn.dataset.set; const val = btn.dataset.val;
  const r = rows.find(x=>x.row===row); if(!r) return;
  const old = {status:r.status, contacted:r.contacted};
  if(field==="contacted"){ r.contacted = val==="true"; if(r.contacted && r.status==="جديد") r.status="تواصلنا"; }
  else { r.status = val; if(val!=="جديد" && val!=="ملغي") r.contacted = true; }
  render(); const a2=$(`[data-row="${row}"]`); a2&&a2.classList.add("busy");
  try{ await api({action:"set",row,status:r.status,contacted:r.contacted}); }
  catch(e){ Object.assign(r,old); showErr("ما انحفظ التغيير: "+e.message); }
  render();
}

$("#enter").onclick=()=>{ KEY=$("#key").value.trim(); if(!KEY) return; try{localStorage.setItem("bs_dash_key",KEY)}catch(e){} load(); };
$("#key").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#enter").click(); });
$("#refresh").onclick=load;
$("#logout").onclick=()=>{ try{localStorage.removeItem("bs_dash_key")}catch(e){} KEY=""; rows=[]; load(); };
$("#q").oninput=e=>{ q=e.target.value.trim(); render(); };
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && KEY) load(); });
setInterval(()=>{ if(KEY && !document.hidden) load(); }, 60000);
load();
</script>
</body>
</html>
